<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Бронирование — NOIR</title>
  <link rel="stylesheet" href="../css/main.css" />
  <style>
    #toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: #141414; color: #fff; border: 1px solid #2a2a2a; padding: 10px 14px; border-radius: 10px; opacity: 0; pointer-events: none; transition: opacity .25s ease, transform .25s ease; }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }
  </style>
</head>
<body>
  <header class="header">
    <div class="container nav">
      <div class="nav__logo">NOIR</div>
      <nav class="nav__links" aria-label="Основная навигация">
        <a class="nav__link" href="../index.html">Главная</a>
        <a class="nav__link" href="menu.html">Меню</a>
        <a class="nav__link" href="about.html">О нас</a>
        <a class="nav__link" href="gallery.html">Галерея</a>
        <a class="nav__link" href="reservations.html">Бронирование</a>
        <a class="nav__link" href="contact.html">Контакты</a>
        <a class="nav__link" href="support.html">Поддержка</a>
      </nav>
    </div>
  </header>

  <main class="section">
    <div class="container">
      <h1 class="section__title">Бронирование столика</h1>
      <p class="section__desc">Заполните форму — и мы свяжемся с вами для подтверждения.</p>

      <form id="reservation-form" class="form" autocomplete="on">
        <div class="input-row">
          <input class="input" type="text" name="name" placeholder="Ваше имя*" required />
          <input class="input" type="tel" name="phone" placeholder="Телефон*" required />
          <input class="input" type="email" name="email" placeholder="Email (по желанию)" />
        </div>
        <div class="input-row">
          <input class="input" type="date" name="date" required />
          <input class="input" type="time" name="time" required />
          <input class="input" type="number" name="people" placeholder="Гостей*" min="1" max="12" required />
        </div>
        <textarea class="input" name="message" rows="4" placeholder="Пожелания"></textarea>
        <div>
          <button class="btn btn--primary magnetic" type="submit">Отправить</button>
        </div>
      </form>
    </div>
  </main>

  <div id="toast" role="status" aria-live="polite"></div>

  <footer class="footer">
    <div class="container">
      <div class="footer__top">
        <div>NOIR</div>
        <div class="muted">Ежедневно 12:00 — 23:00</div>
      </div>
      <div class="footer__bottom">© NOIR, 2025</div>
    </div>
  </footer>

  <script src="../js/main.js"></script>
  <script src="../js/scroll-animations.js"></script>
  <script src="../js/ui.js"></script>
  <script>
  const form = document.getElementById('reservation-form');
  const toast = document.getElementById('toast');
  if (form) {
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const data = new FormData(form);
      try {
        const res = await fetch('../backend/reservations.php', { method: 'POST', body: data });
        const json = await res.json();
        const msg = json.message || (json.ok ? 'Заявка принята' : 'Ошибка');
        toast.textContent = msg;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2800);
        if (json.ok) form.reset();
      } catch (err) {
        toast.textContent = 'Сервер недоступен';
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2800);
      }
    });
  }
  </script>
</body>
</html>
